name: portal_test
description: Quick verification of teleportation logic between linked portals.
gravity: [0, 900]
damping: 0.99
entities:
  - uuid: source_1
    entity_id: data_source
    position: {x: 400, y: 100}
    overrides:
      emit_interval: 2.0
      output_variant: bouncy_ball

  - uuid: portal_entry
    entity_id: portal
    position: {x: 400, y: 200}
    overrides:
      custom_name: "Entrance"
      target_uuid: "portal_exit"
      transit_time: 0.5

  - uuid: portal_exit
    entity_id: portal
    position: {x: 600, y: 200}
    overrides:
      custom_name: "Exit"
      target_uuid: "portal_entry"

  - uuid: catcher
    entity_id: basket
    position: {x: 600, y: 550}
    overrides: {}

connections:
  - sender: portal_entry
    receiver: portal_exit
