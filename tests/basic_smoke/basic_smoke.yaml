name: "Basic Smoke Test"
description: "Simple test of the Automated Test Runner."
gravity: [0, 900]
damping: 0.99
wind: [0, 0]
entities:
  - entity_id: "test_source"
    uuid: "source_1"
    position:
      x: 400
      y: 100
    overrides:
      exit_velocity: 200.0
      exit_angle: 90.0
  - entity_id: "data_sink_csv"
    uuid: "sink_1"
    position:
      x: 400
      y: 500
    overrides:
      exporter_type: "csv"
      export:
        directory: "tests/basic_smoke/output"
        file_prefix: "result"
  - entity_id: "data_pipe"
    uuid: "pipe_1"
    position:
      x: 400
      y: 300
    overrides:
      source_uuid: "source_1"
      target_uuid: "sink_1"
      active_side: "bottom"
