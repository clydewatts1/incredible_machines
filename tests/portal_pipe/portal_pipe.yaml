name: portal_pipe_test
description: Verification of Portal-to-Pipe and Pipe-to-Portal hand-off.
gravity: [0, 900]
damping: 0.99
entities:
- uuid: source_1
  entity_id: data_source
  position: {x: 400.0, y: 50.0}
  overrides:
    emit_interval: 10.0
    output_variant: payload_ball
- uuid: portal_A
  entity_id: portal
  position: {x: 400.0, y: 150.0}
  overrides:
    custom_name: Portal A
    target_uuid: data_pipe_1
    max_threshold_count: 100
- uuid: data_pipe_1
  entity_id: data_pipe
  position: {x: 500.0, y: 300.0}
  overrides:
    source_uuid: portal_A
    target_uuid: portal_B
    transit_time: 1.0
- uuid: portal_B
  entity_id: portal
  position: {x: 600.0, y: 500.0}
  overrides:
    custom_name: Portal B
connections: []
