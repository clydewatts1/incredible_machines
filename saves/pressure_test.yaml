name: Pressure Plate Verification
description: Dropping a ball onto a pressure plate to trigger fireworks.
entities:
  - uuid: source_01
    variant_key: data_source
    position: {x: 400, y: 100}
    properties:
      emit_interval: 3.0
  
  - uuid: plate_01
    variant_key: pressure_plate
    position: {x: 400, y: 500}
    properties:
      width: 150
      height: 20
      is_sensor: False
      cooldown: 0.8
    connected_uuids: ["fx_box_01"]

  - uuid: fx_box_01
    variant_key: effect_box
    position: {x: 600, y: 300}
    properties:
      effect_type: "firework"
