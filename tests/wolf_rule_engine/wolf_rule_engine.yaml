metadata:
  name: "wolf_rule_engine"
  description: "Verify WOLF Event-Driven logic and Priority Sorting."

entities:
  - uuid: "test_source_1"
    entity_id: "test_source"
    position: {x: 100.0, y: 100.0}
    rotation: 0.0
    overrides:
      target_uuid: "warehouse_1"

  - uuid: "warehouse_1"
    entity_id: "warehouse"
    position: {x: 100.0, y: 300.0}
    rotation: 0.0
    overrides:
      auto_release: false
      capacity: 10

  - uuid: "guard_1"
    entity_id: "guard"
    position: {x: 300.0, y: 300.0}
    rotation: 0.0
    overrides:
      source_uuid: "warehouse_1"
      target_uuid: "sink_1"
      guard_query: "amount > 0"
      sort_by: "amount"
      sort_order: "desc"
      scan_interval: 0.05

  - uuid: "sink_1"
    entity_id: "data_sink"
    position: {x: 500.0, y: 300.0}
    rotation: 0.0

connections: []
