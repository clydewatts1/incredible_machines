name: "Incredible Machines External Configuration"
version: "1.0"

templates:
  Square:
    friction: 0.5
    elasticity: 0.5
    collision_sound: "default_collision.wav"
    spawn_sound: "spawn.wav"
    texture_path: ""
  UShape:
    friction: 0.5
    elasticity: 0.5
    mass: 1.0
    collision_sound: "default_collision.wav"
    spawn_sound: "spawn.wav"
    texture_path: ""
  Rectangle:
    friction: 0.5
    elasticity: 0.5
    mass: 1.0
    collision_sound: "default_collision.wav"
    spawn_sound: "spawn.wav"
    texture_path: ""
  Circle:
    friction: 0.5
    elasticity: 0.5
    mass: 1.0
    collision_sound: "default_collision.wav"
    spawn_sound: "spawn.wav"
    texture_path: ""
  Diamond:
    friction: 0.5
    elasticity: 0.5
    mass: 1.0
    collision_sound: "default_collision.wav"
    spawn_sound: "spawn.wav"
    texture_path: ""
  Half-Circle:
    friction: 0.5
    elasticity: 0.5
    mass: 1.0
    collision_sound: "default_collision.wav"
    spawn_sound: "spawn.wav"
    texture_path: ""
  Quarter-Circle:
    friction: 0.5
    elasticity: 0.5
    mass: 1.0
    collision_sound: "default_collision.wav"
    spawn_sound: "spawn.wav"
    texture_path: ""

variants:
  bouncy_ball:
    template: "Circle"
    label: "Bouncy Ball"
    category: "payloads"
    key_bind: "1"
    friction: 0.3
    elasticity: 0.9
    radius: 15
    mass: 1.0
    collision_sound: "bounce.wav"

  payload_ball:
    label: "Payload Ball"
    category: "payloads"
    template: "Circle"
    radius: 15
    mass: 1.0
    color: [0, 255, 255]
    properties:
      score: 100


  long_ramp:
    template: "Rectangle"
    label: "Long Ramp"
    category: "blocks"
    key_bind: "2"
    friction: 0.8
    elasticity: 0.2
    width: 100
    height: 10
    is_static: True
    is_reactive: true
    flash_duration: 0.3


  diamond:
    template: "Diamond"
    label: "Diamond"
    category: "blocks"
    key_bind: "3"
    width: 40
    height: 40
    mass: 50.0
    is_static: True
    is_reactive: true
    flash_duration: 0.3
    color: [255, 0, 0]

  half_circle:
    template: "Half-Circle"
    label: "Half Circle"
    category: "blocks"
    key_bind: "4"
    radius: 50
    segments: 15
    mass: 5.0
    is_static: True
    is_reactive: true
    flash_duration: 0.3
    color: [0, 200, 200]

  quarter_circle:
    template: "Quarter-Circle"
    label: "Quarter Circle"
    category: "blocks"
    key_bind: "5"
    radius: 50
    segments: 15
    is_static: True
    is_reactive: true
    flash_duration: 0.3
    mass: 5.0
    color: [200, 200, 0]

  textured_rectangle:
    template: "Rectangle"
    label: "Textured Rectangle"
    category: "blocks"
    key_bind: "6"
    width: 60
    height: 60
    is_static: True


  box:
    template: "Square"
    label: "Box"
    category: "blocks"
    key_bind: "6"
    width: 40
    height: 40
    is_static: True
    is_reactive: true
    flash_duration: 0.3
    elasticity: 0.5



  spring:
    template: "Square"
    label: "Spring"
    category: "blocks"
    key_bind: "6"
    width: 20
    height: 40
    is_static: True
    is_reactive: true
    flash_duration: 0.3
    elasticity: 1.2

  bouncy:
    template: "Square"
    label: "Bouncy"
    category: "blocks"
    key_bind: "7"
    width: 40
    height: 40
    is_static: True 
    is_reactive: true
    flash_duration: 0.3
    elasticity: 1.5



  cannon:
    template: "Rectangle"
    label: "Cannon"
    category: "active"
    width: 60
    height: 30
    is_static: True
    active_side: "right"
    exit_velocity: 800.0
    exit_angle: 0.0
    shoot_frequency: 1.0
    max_count: 10
    ammo_id: "bouncy_ball"
    texture_path: ""


  basket:
    template: "Rectangle"
    label: "Basket"
    category: "active"
    width: 80
    height: 60
    is_static: True
    active_sides: ["top"]
    accepts_types: ["bouncy_ball"]
    texture_path: ""

  motor:
    template: "Circle"
    label: "Motor"
    category: "active"
    radius: 30
    is_static: False
    motor_speed: 3.14
    direction: "clockwise"
    color: [200, 100, 50]

  guard:
    template: "Rectangle"
    label: "Guard"
    category: "logic"
    width: 64
    height: 64
    is_static: True
    texture_path: ""
    guard_query: "True"
    sort_by: ""
    sort_order: "desc"
    scan_interval: 0.5
    source_uuid: ""
    target_uuid: ""
    color: [0, 150, 255]

  logic_factory:
    template: "Rectangle"
    label: "Logic Factory"
    category: "logic"
    width: 96
    height: 96
    is_static: True
    active_sides: ["top"]
    texture_path: ""
    engine_type: "regex"
    cost_modifier: -10.0
    tired_velocity: 160.0
    instructions:
      rules:
        - target_field: "status"
          pattern: "^SUCCESS$"
          state: 100
        - target_field: "user"
          pattern: "^ADMIN.*"
          state: 50
      default_state: 0
    # Strict I/O Alignment (v1.3.0): Factory is 1-In, 1-Out.
    # Routing is now handled by Guards or single target_uuid.
    # Legacy 'routing' table deprecated.
    animations:
      OFF: "sprite_factory_off"
      INITIALIZING: "sprite_factory_initializing"
      IDLE: "sprite_factory_idle"
      PROCESSING: "sprite_factory_processing"
      EMITTING: "sprite_factory_emitting"
      FATAL: "sprite_factory_fatal"
      JAMMED: "sprite_factory_jammed"
      COOLDOWN: "sprite_factory_cooldown"

  data_source:
    template: "Rectangle"
    label: "Data Source"
    category: "sources"
    width: 96
    height: 96
    is_static: True
    active_side: "Bottom"
    exit_velocity: 150.0
    exit_angle: 0.0
    emit_interval: 2.0
    output_variant: "bouncy_ball"  # Emitted entity variant (defaults to bouncy_ball if omitted)
    engine_type: "null"
    instructions: {}
    animations:
      OFF: "data_source_off"
      INITIALIZING: "data_source_initializing"
      IDLE: "data_source_idle"
      POLLING: "data_source_polling"
      EMITTING: "data_source_emitting"
      EXHAUSTED: "data_source_exhausted"
      FATAL: "data_source_fatal"
    sounds:
      OFF: null
      INITIALIZING: null
      IDLE: null
      POLLING: null
      EMITTING: null
      EXHAUSTED: null
      FATAL: null

  data_source_csv:
    template: "Rectangle"
    label: "CSV Data Source"
    category: "sources"
    width: 96
    height: 96
    is_static: True
    active_side: "Left"
    exit_velocity: 150.0
    exit_angle: 180.0
    emit_interval: 2.0
    output_variant: "payload_ball"  # Emitted entity variant (defaults to bouncy_ball if omitted)
    engine_type: "csv"
    instructions:
      filepath: "data/samples.csv"
      debug: false
      loop: true
      skip_header: true
      delimiter: ","
    animations:
      OFF: "data_source_off"
      INITIALIZING: "data_source_initializing_csv"
      IDLE: "data_source_idle_csv"
      POLLING: "data_source_polling_csv"
      EMITTING: "data_source_emitting_csv"
      EXHAUSTED: "data_source_exhausted_csv"
      FATAL: "data_source_fatal_csv"
    sounds:
      OFF: null
      INITIALIZING: null
      IDLE: null
      POLLING: null
      EMITTING: null
      EXHAUSTED: null
      FATAL: null

  data_source_mcp:
    template: "Rectangle"
    label: "MCP Data Source"
    category: "sources"
    width: 96
    height: 96
    is_static: True
    active_side: "Top"
    exit_velocity: 120.0
    exit_angle: 45.0
    emit_interval: 3.0
    output_variant: "bouncy_ball"  # Emitted entity variant (defaults to bouncy_ball if omitted)
    engine_type: "mcp"
    instructions:
      transport: "sse"
      url: "http://localhost:8000/sse"
      tool_name: "get_incredible_machine_data"
      timeout: 5
    animations:
      OFF: "data_source_off"
      INITIALIZING: "data_source_initializing_mcp"
      IDLE: "data_source_idle_mcp"
      POLLING: "data_source_polling_mcp"
      EMITTING: "data_source_emitting_mcp"
      EXHAUSTED: "data_source_exhausted_mcp"
      FATAL: "data_source_fatal_mcp"
    sounds:
      OFF: null
      INITIALIZING: null
      IDLE: null
      POLLING: null
      EMITTING: null
      EXHAUSTED: null
      FATAL: null

  data_sink:
    template: "Rectangle"
    label: "Data Sink"
    category: "sinks"
    width: 96
    height: 96
    is_static: True
    active_sides: ["top"]
    accepts_types: ["bouncy_ball","payload_ball"]
    exporter_type: "null"
    export:
      directory: "exports"
      file_prefix: "sink_output"
      max_objects: 10
      rotation_seconds: 180
    animations:
      OFF: "data_sink_off"
      INITIALIZING: "data_sink_initializing"
      IDLE: "data_sink_idle"
      INGESTING: "data_sink_ingesting"
      WRITING: "data_sink_writing"
      FATAL: "data_sink_fatal"
    sounds:
      OFF: null
      INITIALIZING: null
      IDLE: null
      INGESTING: null
      WRITING: null
      FATAL: null

  data_sink_csv:
    template: "Rectangle"
    label: "Data Sink CSV"
    category: "sinks"
    width: 96
    height: 96
    is_static: True
    active_sides: ["top"]
    accepts_types: ["bouncy_ball", "payload_ball"]
    exporter_type: "csv"
    export:
      directory: "exports"
      file_prefix: "sink_csv"
      max_objects: 10
      rotation_seconds: 180
    animations:
      OFF: "data_sink_off_csv"
      INITIALIZING: "data_sink_initializing_csv"
      IDLE: "data_sink_idle_csv"
      INGESTING: "data_sink_ingesting_csv"
      WRITING: "data_sink_writing_csv"
      FATAL: "data_sink_fatal_csv"
    sounds:
      OFF: null
      INITIALIZING: null
      IDLE: null
      INGESTING: null
      WRITING: null
      FATAL: null

  data_sink_json:
    template: "Rectangle"
    label: "Data Sink JSON"
    category: "sinks"
    width: 96
    height: 96
    is_static: True
    active_sides: ["top"]
    accepts_types: ["bouncy_ball", "payload_ball"]
    exporter_type: "json"
    export:
      directory: "exports"
      file_prefix: "sink_json"
      max_objects: 10
      rotation_seconds: 180
    animations:
      OFF: "data_sink_off_json"
      INITIALIZING: "data_sink_initializing_json"
      IDLE: "data_sink_idle_json"
      INGESTING: "data_sink_ingesting_json"
      WRITING: "data_sink_writing_json"
      FATAL: "data_sink_fatal_json"
    sounds:
      OFF: null
      INITIALIZING: null
      IDLE: null
      INGESTING: null
      WRITING: null
      FATAL: null

  data_sink_yaml:
    template: "Rectangle"
    label: "Data Sink YAML"
    category: "sinks"
    width: 96
    height: 96
    is_static: True
    active_sides: ["top"]
    accepts_types: ["bouncy_ball", "payload_ball"]
    exporter_type: "yaml"
    export:
      directory: "exports"
      file_prefix: "sink_yaml"
      max_objects: 10
      rotation_seconds: 180
    animations:
      OFF: "data_sink_off_yaml"
      INITIALIZING: "data_sink_initializing_yaml"
      IDLE: "data_sink_idle_yaml"
      INGESTING: "data_sink_ingesting_yaml"
      WRITING: "data_sink_writing_yaml"
      FATAL: "data_sink_fatal_yaml"
    sounds:
      OFF: null
      INITIALIZING: null
      IDLE: null
      INGESTING: null
      WRITING: null
      FATAL: null

  data_sink_mcp:
    template: "Rectangle"
    label: "Data Sink MCP"
    category: "sinks"
    width: 96
    height: 96
    is_static: True
    active_sides: ["top"]
    accepts_types: ["bouncy_ball", "payload_ball"]
    exporter_type: "mcp"
    export:
      transport: "sse"
      url: "http://localhost:8000/sse"
      tool_name: "post_incredible_machine_data"
      timeout: 5
    animations:
      OFF: "data_sink_off_mcp"
      INITIALIZING: "data_sink_initializing_mcp"
      IDLE: "data_sink_idle_mcp"
      INGESTING: "data_sink_ingesting_mcp"
      WRITING: "data_sink_writing_mcp"
      FATAL: "data_sink_fatal_mcp"
      
    sounds:
      OFF: null
      INITIALIZING: null
      IDLE: null
      INGESTING: null
      WRITING: null
      FATAL: null
# new mechanical parts category for gears, axles, and eventually pulleys and levers 
  gear_driver:
    template: "Circle"
    label: "Gear Driver"
    category: "mechanical"
    radius: 40
    is_driver: True
    is_static: True
    motor_speed: 4.0
    #texture_path: "assets/sprites/gear_large.png"
    #texture_path_alt: "assets/sprites/gear_large_alt.png"

  gear_follower:
    template: "Circle"
    label: "Gear Follower"
    category: "mechanical"
    radius: 20
    is_driver: False
    is_static: False
    #texture_path: "assets/sprites/gear_small.png"
    #texture_path_alt: "assets/sprites/gear_small_alt.png"


  axle:
    template: "Circle"
    label: "Mechanical Axle"
    category: "mechanical"
    radius: 10
    mass: 1.0
    description: "A simple axle that can connect to gears and belts. Can be static or dynamic." 

  belt_tool:
    label: "Belt Connector"
    category: "mechanical"
    template: "Rectangle" # Template is required by the base GamePart loader
    color: [60, 60, 60]
    is_static: True # Tools themselves don't need physics bodies
    description: "Connects two axles to create a belt drive."

  conveyor_belt:
    label: "Conveyor Belt"
    category: "mechanical"
    template: "Rectangle"
    width: 120
    height: 20
    is_static: True
    friction: 2.0
    speed: 100.0
    direction: "right"
    color: [100, 100, 100]

  text_box:
    label: "Text Box"
    category: "other"
    template: "Rectangle"
    width: 100
    height: 50
    is_static: True
    text: "Enter description..."
    font_size: 20
    text_color: [255, 255, 255]
    bg_color: [40, 40, 40, 200]


# New entities for 2026-03-18
# the brain
  ai_brain:
    label: "AI Brain Node"
    category: "logic"
    template: "Rectangle"
    width: 96
    height: 96
    is_static: True
    model: "tinyllama"
  
    # --- NEW: I/O Configuration ---
    input_side: "top"      # Only accept payloads falling from the 'top'
    output_side: "right"   # Default side to shoot out of ('top', 'left', 'right', 'bottom')
    cost_modifier: -10.0   # How much energy a "thought" consumes
  
    system_prompt: "You are a quality control AI. Look at the 'status' field. If the status is 'SUCCESS', return route_state 10. If 'FAILURE', return route_state 100."
    # Strict I/O Alignment (v1.3.0): Brain is 1-In, 1-Out.
    # Complex split-routing should use a Warehouse + Guards.
    # Legacy 'routing' table deprecated.
    animations:
      OFF: "ai_brain_off"
      INITIALIZING: "ai_brain_initializing"
      IDLE: "ai_brain_idle"
      INGESTING: "ai_brain_ingesting"
      WRITING: "ai_brain_writing"
      FATAL: "ai_brain_fatal"
      
  warehouse:
    label: "Warehouse Buffer"
    category: "logic"
    template: "Rectangle"  # We use rectangle for the physics bounds, but we draw a triangle!
    width: 96
    height: 96
    is_static: True
    capacity: 20
    release_interval: 1.0
    input_side: "top"
    output_side: "bottom"
    animations:
      OFF: "warehouse_off"
      INITIALIZING: "warehouse_initializing"
      IDLE: "warehouse_idle"
      INGESTING: "warehouse_ingesting"
      WRITING: "warehouse_writing"
      FATAL: "warehouse_fatal"
    sounds:
      OFF: null
      INITIALIZING: null
      IDLE: null
      INGESTING: null
      WRITING: null
      FATAL: null

  portal:
    label: "Quantum Portal"
    category: "logic"
    template: "Rectangle"  # Bounds are rectangle, sprite is a circle
    width: 64
    height: 64
    is_static: True
    target_uuid: ""
    max_threshold_count: 10
    error_entity_id: ""
    transit_time: 0.5

# Added in 2026-03-19 - data pipe
  data_pipe:
    name: "Data Pipe"
    category: "logic"
    template: "Rectangle"
    width: 20
    height: 20
    color: [100, 200, 255]
    properties:
      capacity: 5             # Maximum number of balls the pipe can hold at once
      transit_time: 2.0       # How many seconds it takes to travel from source to target
    route_state: 10         # The routing state this pipe listens for from the Brain

# Added in 2026-03-19 - smart splitter (M29)
  smart_splitter:
    label: "Smart Splitter"
    category: "logic"
    template: "Rectangle"
    width: 100
    height: 100
    is_static: True
    left_weight: 10.0         # Initial weight for left path
    right_weight: 10.0        # Initial weight for right path
    learning_rate: 2.0        # How much to adjust weights on feedback
    exit_velocity: 150.0      # Speed at which payloads exit
    exit_angle: 0.0           # Angle offset for ejection

  test_source:
    template: "Circle"
    label: "Test Source"
    category: "sources"
    radius: 30
    is_static: True
    active_side: "Bottom"
    exit_velocity: 200.0
    exit_angle: 0.0
    color: [255, 100, 255] # Pink/Magenta for test markers
    description: "Specialized data source for automated testing. Emits payloads at exact physics ticks defined in inputs.json."

# Milestone 40: Synthetic Data Pipeline (ETL)
  faker_source:
    label: "Faker Source"
    category: "sources"
    template: "Rectangle"
    width: 96
    height: 96
    is_static: True
    color: [180, 100, 255]
    faker_schema:
      name: "name"
      email: "email"
      job: "job"
    emit_interval: 2.0
    exit_velocity: 150.0
    active_side: "bottom"

  faker_factory:
    label: "Faker Factory"
    category: "logic"
    template: "Rectangle"
    width: 96
    height: 96
    is_static: True
    color: [100, 255, 180]
    engine_type: "faker"
    instructions:
      schema:
        company_email: "company_email"
        phone: "phone_number"
      state: 10
    description: "Mutates payload data using the Faker library."

  file_sink:
    label: "File Sink"
    category: "sinks"
    template: "Rectangle"
    width: 96
    height: 96
    is_static: True
    color: [255, 180, 100]
    output_directory: "exports/synthetic_data"

# Milestone 41: Visuals & Triggers
  pressure_plate:
    label: "Pressure Plate"
    category: "visuals"
    template: "Rectangle"
    width: 80
    height: 10
    is_static: True
    is_sensor: False
    cooldown: 0.5
    color: [180, 180, 180]
    description: "Detects when a dynamic body is on top and broadcasts a signal."

  effect_box:
    label: "Effect Box"
    category: "active"
    template: "Rectangle"
    width: 64
    height: 64
    is_static: True
    color: [240, 240, 240]
    effect_type: "confetti"
    auto_trigger_interval: 0.0
    daisy_chain: False
    trigger_on_impact: False
    firing_duration: 1.0
    delay_duration: 0.0
    cooldown_duration: 0.5
    animations:
      IDLE: "effect_box_idle"
      EMITTING: "effect_box_emitting"
    description: "Visual emitter that triggers particles like confetti or fireworks via signals."
  
  avatar:
    label: "AV"
    description: "Player Avatar. Controlled via Left Stick (Gamepad)."
    category: "logic"
    template: "Circle"
    radius: 20
    is_static: False
    color: [50, 200, 50]
    mass: 5.0
    spawn_sound: "spawn.wav"
    width: 40
    height: 40